    <a class="logo" href="index.html">A<span>M</span></a>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Apri il menu">
      <span class="nav-toggle__bars" aria-hidden="true"><span></span><span></span><span></span></span>

    </nav>
  </div>
</header>

<main>

  <div class="page-header wrap">
    <span class="eyebrow">Tav. 03 — Contacts</span>
    <h1>Contacts</h1>
    <p class="page-header__lead">Per una consulenza o per parlare di un progetto, scrivi o compila il modulo.</p>
  </div>

  <div class="wrap"><div class="scale-rule"></div></div>

  <section class="section wrap">
    <div class="contact-grid">

      <div>
        <div class="title-block">
          <div class="title-block__row">
            <span class="title-block__label">Nome</span>
            <span class="title-block__value">Aldo Marsiglia</span>
          </div>
          <div class="title-block__row">
            <span class="title-block__label">Email</span>
            <span class="title-block__value"><a href="mailto:aldomarsiglia75@gmail.com">aldomarsiglia75@gmail.com</a></span>
          </div>
          <div class="title-block__row">
            <span class="title-block__label">Sede</span>
            <span class="title-block__value">Milano</span>
          </div>
        </div>

        <div class="social-row">
          <a href="https://www.instagram.com/aldomarsiglia_/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://pin.it/Y6C967QTH" target="_blank" rel="noopener">Pinterest</a>
        </div>
      </div>

      <!-- Il form non invia dati: serve collegarlo a un servizio (es. Formspree) o a uno script server-side -->
      <form>
        <div class="form-field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="messaggio">Messaggio</label>
          <textarea id="messaggio" name="messaggio" required></textarea>
        </div>
        <button class="btn" type="submit">Invia messaggio</button>
      </form>

    </div>
  </section>

</main>
